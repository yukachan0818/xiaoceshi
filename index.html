<!doctype html>
<html lang="zh-CN">
<head>

<title>情侣减脂计划 V2</title>
<link rel="manifest" href="manifest.webmanifest"/>
<style>
:root{--bg:#f6f7f4;--card:#fff;--ink:#17231e;--muted:#66736c;--line:#e4e7e3;--accent:#1f6f56;--accent2:#e5f2ed;--warn:#a76414;--warn2:#fff2dd;--bad:#b44444;--bad2:#fdeaea;--blue:#315f9a;--blue2:#e8f0fb;--radius:22px;--shadow:0 16px 40px rgba(20,40,30,.08)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}.app{max-width:1040px;margin:0 auto;min-height:100vh;padding-bottom:98px}.topbar{position:sticky;top:0;z-index:20;background:rgba(246,247,244,.9);backdrop-filter:blur(18px);display:flex;align-items:center;justify-content:space-between;padding:16px 18px 10px}.brand{font-weight:900;letter-spacing:-.04em;font-size:21px}.brand small{font-weight:650;color:var(--muted);font-size:11px;margin-left:7px}.avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:white;font-weight:850;border:0}.page{padding:8px 16px 24px}.hero{background:linear-gradient(135deg,#163c31,#277b60);color:white;border-radius:28px;padding:24px;box-shadow:var(--shadow);overflow:hidden;position:relative}.hero:after{content:"";position:absolute;width:190px;height:190px;border-radius:50%;background:rgba(255,255,255,.08);right:-70px;top:-70px}.hero h1{font-size:30px;line-height:1.06;margin:0 0 8px;letter-spacing:-.05em}.hero p{margin:0;color:#d8ede5;max-width:620px}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:20px}.metric{background:rgba(255,255,255,.11);padding:12px;border-radius:16px}.metric b{display:block;font-size:20px}.metric span{font-size:11px;color:#d7ebe4}.grid{display:grid;grid-template-columns:1.25fr .75fr;gap:14px;margin-top:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:0 5px 15px rgba(20,30,25,.025)}.card h2{font-size:17px;margin:0 0 14px}.card h3{font-size:15px;margin:0 0 10px}.row{display:flex;gap:10px;align-items:center}.between{justify-content:space-between}.wrap{flex-wrap:wrap}.muted{color:var(--muted)}.tiny{font-size:12px}.pill{display:inline-flex;align-items:center;gap:6px;background:var(--accent2);color:var(--accent);padding:7px 10px;border-radius:999px;font-size:12px;font-weight:750}.pill.warn{background:var(--warn2);color:var(--warn)}.pill.bad{background:var(--bad2);color:var(--bad)}.pill.blue{background:var(--blue2);color:var(--blue)}.progress{height:10px;background:#edf0ed;border-radius:999px;overflow:hidden}.progress i{height:100%;display:block;background:var(--accent);border-radius:999px}.progress.warn i{background:var(--warn)}.meal{display:grid;grid-template-columns:82px 1fr auto;gap:12px;padding:13px 0;border-top:1px solid var(--line)}.meal:first-of-type{border-top:0}.meal img{width:82px;height:82px;object-fit:cover;border-radius:17px;background:#eef0ed}.meal b{display:block;margin-bottom:4px}.meal .kcal{font-weight:900;font-size:18px}.meal .score{font-size:12px;font-weight:750;color:var(--accent)}.partner{display:flex;gap:12px;align-items:center;padding:6px 0}.partner .face{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:23px;background:#f0ece5}.stat-list{display:grid;gap:7px}.stat-line{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}.stat-line:last-child{border-bottom:0}.chart{display:flex;align-items:end;height:130px;gap:8px;padding:16px 4px 25px}.bar{flex:1;min-width:18px;background:#dfe8e3;border-radius:9px 9px 4px 4px;position:relative}.bar.me{background:#4f9f83}.bar span{position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--muted);white-space:nowrap}.fab{position:fixed;right:max(20px,calc((100vw - 1040px)/2 + 20px));bottom:84px;width:60px;height:60px;border-radius:50%;background:var(--accent);color:white;border:0;font-size:30px;box-shadow:0 14px 30px rgba(31,111,86,.28);z-index:25}.nav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.96);backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:22}.nav-inner{max-width:1040px;width:100%;display:grid;grid-template-columns:repeat(5,1fr)}.nav button{border:0;background:none;padding:10px 4px 14px;color:var(--muted);font-size:11px}.nav button strong{display:block;font-size:19px;margin-bottom:2px}.nav button.active{color:var(--accent);font-weight:850}.modal{position:fixed;inset:0;background:rgba(12,20,16,.48);display:grid;place-items:end center;z-index:50;padding:14px}.sheet{width:min(660px,100%);max-height:93vh;overflow:auto;background:white;border-radius:28px 28px 18px 18px;padding:20px}.sheet h2{margin:0 0 14px}.field{margin:12px 0}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;border:1px solid #dcdedb;border-radius:14px;padding:12px;background:#fff}.field textarea{min-height:80px;resize:vertical}.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.seg button{border:1px solid var(--line);background:#fafafa;border-radius:12px;padding:9px}.seg button.on{background:var(--accent2);border-color:#b7d9cb;color:var(--accent);font-weight:850}.photo-box{border:1.5px dashed #cad0cc;border-radius:18px;min-height:160px;display:grid;place-items:center;text-align:center;overflow:hidden;background:#fafbf9}.photo-box img{width:100%;max-height:280px;object-fit:cover}.primary{width:100%;border:0;border-radius:15px;padding:13px;background:var(--accent);color:white;font-weight:850}.secondary{border:1px solid var(--line);background:white;border-radius:13px;padding:10px 12px}.danger{color:var(--bad)}.login-wrap{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 80% 10%,#dcefe6 0,transparent 35%),var(--bg)}.login-card{width:min(440px,100%);background:white;border:1px solid var(--line);border-radius:30px;padding:26px;box-shadow:var(--shadow)}.login-logo{width:54px;height:54px;background:var(--accent);color:white;border-radius:18px;display:grid;place-items:center;font-size:26px;margin-bottom:22px}.login-card h1{font-size:31px;margin:0 0 8px;letter-spacing:-.05em}.demo{background:#f6f8f6;border-radius:16px;padding:12px;margin:14px 0;font-size:12px;line-height:1.75}.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#17231e;color:white;padding:10px 14px;border-radius:999px;font-size:12px;z-index:80;box-shadow:var(--shadow);max-width:90vw;text-align:center}.feed-card{display:grid;grid-template-columns:100px 1fr;gap:13px;padding:14px 0;border-bottom:1px solid var(--line)}.feed-card img{width:100px;height:100px;border-radius:18px;object-fit:cover;background:#eef0ed}.rating{font-weight:850}.good{color:var(--accent)}.mid{color:var(--warn)}.bad{color:var(--bad)}.reaction{border:1px solid var(--line);background:white;border-radius:999px;padding:6px 9px;font-size:12px}.reaction.on{background:var(--accent2);border-color:#b7d9cb}.callout{padding:12px;border-radius:16px;background:#f7faf8;font-size:13px;line-height:1.55}.callout.warn{background:var(--warn2)}.callout.bad{background:var(--bad2)}.result{border:1px solid #cfe1d8;background:#f7fbf9;border-radius:18px;padding:14px;margin:12px 0}.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.badge{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--accent2)}.check-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.check-btn{border:1px solid var(--line);background:#fff;border-radius:14px;padding:11px;text-align:left}.check-btn.on{background:var(--accent2);border-color:#b7d9cb}.week-score{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.scorebox{background:#f7f8f6;border-radius:16px;padding:12px}.scorebox b{font-size:19px;display:block}.empty{padding:28px 10px;text-align:center;color:var(--muted)}.switch{display:flex;gap:8px}.switch button{flex:1;border:1px solid var(--line);background:white;border-radius:12px;padding:9px}.switch button.on{background:var(--accent2);color:var(--accent);font-weight:800}.kbd{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;background:#f0f2ef;padding:2px 6px;border-radius:6px}@media(max-width:760px){.grid{grid-template-columns:1fr}.summary{grid-template-columns:repeat(2,1fr)}.meal{grid-template-columns:72px 1fr}.meal>div:last-child{grid-column:2}.feed-card{grid-template-columns:82px 1fr}.feed-card img{width:82px;height:82px}.week-score{grid-template-columns:1fr 1fr}.check-grid{grid-template-columns:1fr}.split{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="loginScreen" class="login-wrap"><div class="login-card"><div class="login-logo">🔥</div><h1>情侣减脂计划</h1><p class="muted">两个人一起记录、监督和复盘。</p><div class="field"><label>账号</label><input id="loginUser" autocomplete="username" placeholder="输入账号"></div><div class="field"><label>密码</label><input id="loginPass" type="password" autocomplete="current-password" placeholder="输入密码"></div><button class="primary" onclick="login()">登录</button><div class="demo"><b>演示账号</b><br>雪华：<span class="kbd">xuehua</span> / <span class="kbd">123456</span><br>伴侣：<span class="kbd">yulong</span> / <span class="kbd">123456</span><br><span class="muted">V2 仍采用当前浏览器本地存储；“云端双人同步”接口已预留。</span></div></div></div>
<div id="app" class="app hidden"><header class="topbar"><div class="brand">Couple Cut <small>V2</small></div><button id="avatarBtn" class="avatar" onclick="switchUser()">雪</button></header><main id="pageHome" class="page"></main><main id="pageFeed" class="page hidden"></main><main id="pageCheck" class="page hidden"></main><main id="pageProgress" class="page hidden"></main><main id="pageProfile" class="page hidden"></main></div>
<button id="fab" class="fab hidden" onclick="openMeal()">＋</button>
<nav id="nav" class="nav hidden"><div class="nav-inner"><button class="active" data-page="Home" onclick="showPage('Home',this)"><strong>⌂</strong>首页</button><button data-page="Feed" onclick="showPage('Feed',this)"><strong>♡</strong>彼此</button><button data-page="Check" onclick="showPage('Check',this)"><strong>✓</strong>打卡</button><button data-page="Progress" onclick="showPage('Progress',this)"><strong>↗</strong>进度</button><button data-page="Profile" onclick="showPage('Profile',this)"><strong>☻</strong>我的</button></div></nav>
<div id="mealModal" class="modal hidden"><div class="sheet"><div class="row between"><h2>记录这一餐</h2><button class="secondary" onclick="closeMeal()">关闭</button></div><div id="mealSeg" class="seg"></div><div class="field"><label>食物照片</label><label id="photoBox" class="photo-box" for="photoInput"><div><div style="font-size:30px">📷</div><b>拍照或选择食物照片</b><div class="tiny muted">照片会压缩后保存</div></div><input id="photoInput" type="file" accept="image/*" capture="environment" hidden onchange="previewPhoto(this)"></label></div><div class="field"><label>吃了什么 / 大概份量</label><textarea id="foodText" placeholder="例如：鸡胸肉150g、半碗米饭、西兰花一大份"></textarea></div><div class="split"><div class="field"><label>实际吃了多少</label><select id="portion"><option value="1">全部吃完</option><option value="0.75">吃了约 3/4</option><option value="0.5">吃了一半</option><option value="0.25">只吃了约 1/4</option></select></div><div class="field"><label>餐前饥饿感</label><input id="hunger" type="number" min="1" max="10" value="5"></div></div><div class="split"><div class="field"><label>是否为周六自由餐</label><select id="freeMeal"><option value="no">不是</option><option value="yes">是，本周自由餐</option></select></div><div class="field"><label>违规标记（可选）</label><select id="violation"><option value="">无</option><option>偷吃</option><option>零食/甜品/奶茶</option><option>计划外夜宵</option><option>暴食</option></select></div></div><button class="primary" onclick="estimateMeal()">分析这一餐</button><div id="estimateBox" class="result hidden"></div><button id="saveMealBtn" class="primary hidden" style="margin-top:10px" onclick="saveMeal()">确认并保存</button></div></div>
<div id="weightModal" class="modal hidden"><div class="sheet"><div class="row between"><h2>每周身体记录</h2><button class="secondary" onclick="closeWeight()">关闭</button></div><div class="split"><div class="field"><label>体重 kg</label><input id="weightInput" type="number" step="0.1" placeholder="例如 68.4"></div><div class="field"><label>腰围 cm</label><input id="waistInput" type="number" step="0.1" placeholder="例如 82.0"></div></div><div class="field"><label>备注</label><input id="noteInput" placeholder="例如：周日晨起空腹"></div><button class="primary" onclick="saveWeight()">保存本周记录</button></div></div>
<div id="toast" class="toast hidden"></div>
<script>
const USERS={xuehua:{name:'雪华',emoji:'雪',partner:'yulong',targetKcal:1450,targetProtein:90},yulong:{name:'伴侣',emoji:'伴',partner:'xuehua',targetKcal:1850,targetProtein:110}};
const KEYS={db:'coupleCutV2',session:'coupleCutSession'};
const seed={createdAt:new Date().toISOString(),meals:[],weights:{xuehua:[],yulong:[]},checks:{},reactions:{},settings:{syncMode:'local'}};
let DB=loadDB(),current=localStorage.getItem(KEYS.session)||'',mealType='午餐',photoData='',pendingEstimate=null;
function loadDB(){try{return Object.assign(structuredClone(seed),JSON.parse(localStorage.getItem(KEYS.db)||'{}'))}catch(e){return structuredClone(seed)}}
function persist(){localStorage.setItem(KEYS.db,JSON.stringify(DB))}
function today(){return new Date().toISOString().slice(0,10)}
function isSaturday(){return new Date().getDay()===6}
function checkKey(u,d=today()){return u+'@'+d}
function reactionKey(id,u){return id+'@'+u}
function weekDates(){const now=new Date(),day=now.getDay(),diff=(day+6)%7,start=new Date(now);start.setDate(now.getDate()-diff);return Array.from({length:7},(_,i)=>{const d=new Date(start);d.setDate(start.getDate()+i);return d.toISOString().slice(0,10)})}
function login(){const u=document.getElementById('loginUser').value.trim(),p=document.getElementById('loginPass').value;if(USERS[u]&&p==='123456'){current=u;localStorage.setItem(KEYS.session,u);enter()}else toast('账号或密码不正确')}
function enter(){document.getElementById('loginScreen').classList.add('hidden');document.getElementById('app').classList.remove('hidden');document.getElementById('fab').classList.remove('hidden');document.getElementById('nav').classList.remove('hidden');document.getElementById('avatarBtn').textContent=USERS[current].emoji;renderAll()}
function logout(){localStorage.removeItem(KEYS.session);location.reload()}
function switchUser(){current=USERS[current].partner;localStorage.setItem(KEYS.session,current);document.getElementById('avatarBtn').textContent=USERS[current].emoji;renderAll();toast('已切换为'+USERS[current].name)}
function showPage(name,btn){['Home','Feed','Check','Progress','Profile'].forEach(x=>document.getElementById('page'+x).classList.toggle('hidden',x!==name));document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));btn.classList.add('active');document.getElementById('fab').classList.toggle('hidden',name!=='Home'&&name!=='Feed')}
function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function placeholder(type){const emoji={早餐:'🍳',午餐:'🍱',晚餐:'🥗',加餐:'🍎'}[type]||'🍽️';return `data:image/svg+xml;charset=UTF-8,${encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="220" height="220"><rect width="100%" height="100%" fill="#eef2ee"/><text x="50%" y="54%" dominant-baseline="middle" text-anchor="middle" font-size="70">${emoji}</text></svg>`)}`}
function mealsOf(u,d=today()){return DB.meals.filter(m=>m.user===u&&m.date===d).sort((a,b)=>b.ts-a.ts)}
function kcal(u,d=today()){return mealsOf(u,d).reduce((s,m)=>s+(+m.kcal||0),0)}
function protein(u,d=today()){return mealsOf(u,d).reduce((s,m)=>s+(+m.protein||0),0)}
function getCheck(u,d=today()){return DB.checks[checkKey(u,d)]||{water:false,exercise:false,noSnack:false,sleep:false,steps:'',exerciseMin:'',hungerPeak:''}}
function dailyScore(u,d=today()){const c=getCheck(u,d),ms=mealsOf(u,d),uCfg=USERS[u],parts=[ms.length>=2,protein(u,d)>=uCfg.targetProtein*.8,!!c.water,!!c.exercise,!!c.noSnack,!!c.sleep];return Math.round(parts.filter(Boolean).length/parts.length*100)}
function latestWeight(u){const a=DB.weights[u]||[];return a.length?a[a.length-1]:null}
function weightChange(u){const a=DB.weights[u]||[];return a.length<2?null:Math.round((a[a.length-1].weight-a[0].weight)*10)/10}
function weekStats(u){const days=weekDates(),ms=DB.meals.filter(m=>m.user===u&&days.includes(m.date)),active=[...new Set(ms.map(m=>m.date))],avgK=active.length?Math.round(active.reduce((s,d)=>s+kcal(u,d),0)/active.length):0,avgP=active.length?Math.round(active.reduce((s,d)=>s+protein(u,d),0)/active.length):0,checks=days.map(d=>getCheck(u,d)),scores=days.map(d=>dailyScore(u,d)),hs=checks.map(c=>+c.hungerPeak).filter(Boolean),violations=ms.filter(m=>m.violation).length;return{days:active.length,avgK,avgP,avgScore:Math.round(scores.reduce((a,b)=>a+b,0)/7),avgH:hs.length?(hs.reduce((a,b)=>a+b,0)/hs.length).toFixed(1):'—',violations}}
function rescueAdvice(u){const c=getCheck(u),h=+c.hungerPeak||0,k=kcal(u),p=protein(u),cfg=USERS[u];if(h>=9)return '饥饿感很高：不要继续硬撑。优先救援餐（鸡蛋、无糖酸奶、豆腐、鸡胸肉等），如果伴随头晕、发抖、心悸或明显虚弱，请停止限制并进食。';if(h>=7)return '今天比较饿。可以使用一份高蛋白救援餐，不算违规。';if(k<cfg.targetKcal*.55&&p<cfg.targetProtein*.6)return '今天总量和蛋白都偏低。不要为了“赢”而继续减少，优先补蛋白。';return '今天状态可控。保持原计划，不需要额外加码。'}
function renderHome(){const u=USERS[current],p=USERS[u.partner],own=mealsOf(current),pm=mealsOf(u.partner),k=kcal(current),pr=protein(current),kp=Math.min(100,Math.round(k/u.targetKcal*100)),pp=Math.min(100,Math.round(pr/u.targetProtein*100)),c=getCheck(current);document.getElementById('pageHome').innerHTML=`<section class="hero"><h1>${u.name}，今天继续稳住。</h1><p>记录每一餐，蛋白优先，允许轻微饥饿，但不靠极端挨饿换速度。</p><div class="summary"><div class="metric"><b>${k}</b><span>今日 kcal / ${u.targetKcal}</span></div><div class="metric"><b>${pr}g</b><span>蛋白 / ${u.targetProtein}g</span></div><div class="metric"><b>${own.length}</b><span>已记录餐次</span></div><div class="metric"><b>${dailyScore(current)}%</b><span>今日完成度</span></div></div></section><div class="grid"><section class="card"><div class="row between"><h2>我的今天</h2><span class="pill">${isSaturday()?'周六 · 1顿自由餐':'减脂日'}</span></div><div class="tiny muted">热量参考进度</div><div class="progress" style="margin:7px 0 12px"><i style="width:${kp}%"></i></div><div class="tiny muted">蛋白质进度</div><div class="progress" style="margin:7px 0 14px"><i style="width:${pp}%"></i></div>${own.length?own.map(mealRow).join(''):'<div class="empty">还没有记录。拍下第一餐开始吧。</div>'}</section><aside><section class="card"><div class="row between"><h2>${p.name}今天</h2><span class="pill blue">双方可见</span></div><div class="partner"><div class="face">${p.emoji}</div><div><b>${kcal(u.partner)} kcal · ${protein(u.partner)}g蛋白</b><div class="tiny muted">${pm.length}顿 · 完成度 ${dailyScore(u.partner)}%</div></div></div>${pm[0]?`<div class="callout">最近：<b>${pm[0].type}</b> · ${escapeHtml(pm[0].food.slice(0,42))}</div>`:'<div class="callout muted">对方今天还没有记录。</div>'}</section><section class="card" style="margin-top:14px"><h2>今天怎么收尾</h2><div class="callout ${Math.max(...own.map(x=>+x.hunger||0),0)>=8?'warn':''}">${rescueAdvice(current)}</div><div class="stat-list" style="margin-top:8px"><div class="stat-line"><span>剩余参考</span><b>${Math.max(0,u.targetKcal-k)} kcal</b></div><div class="stat-line"><span>最高饥饿感</span><b>${own.length?Math.max(...own.map(x=>+x.hunger||0))+'/10':'—'}</b></div><div class="stat-line"><span>运动</span><b>${c.exercise?'已完成':'未打卡'}</b></div></div></section></aside></div>`}
function mealRow(m){return `<div class="meal"><img src="${m.photo||placeholder(m.type)}"><div><b>${m.type} · ${escapeHtml(m.food||'食物记录')}</b><div class="tiny muted">${escapeHtml(m.comment||'')}</div><div class="score">${m.rating==='很好'?'✓ ':''}${m.rating} · 蛋白约 ${m.protein}g ${m.freeMeal?'· 自由餐':''}</div></div><div style="text-align:right"><div class="kcal">${m.kcal}</div><div class="tiny muted">kcal</div></div></div>`}
function renderFeed(){const p=USERS[current].partner;const all=DB.meals.filter(m=>[current,p].includes(m.user)).sort((a,b)=>b.ts-a.ts).slice(0,40);document.getElementById('pageFeed').innerHTML=`<div class="row between"><div><h1 style="margin:5px 0">彼此的记录</h1><p class="muted">食物照片、热量和评价双方都能看到。</p></div><span class="pill">共享动态</span></div><section class="card">${all.length?all.map(m=>feedItem(m)).join(''):'<div class="empty">还没有共同记录。</div>'}</section>`}
function feedItem(m){const rk=reactionKey(m.id,current),r=DB.reactions[rk]||'';return `<div class="feed-card"><img src="${m.photo||placeholder(m.type)}"><div><div class="row between"><b>${USERS[m.user].name} · ${m.type}</b><span class="tiny muted">${m.date}</span></div><p style="margin:7px 0">${escapeHtml(m.food)}</p><div class="row wrap"><span class="pill">${m.kcal} kcal</span><span class="pill">蛋白 ${m.protein}g</span><span class="rating ${m.rating==='很好'?'good':m.rating==='一般'?'mid':'bad'}">${m.rating}</span>${m.violation?`<span class="pill bad">${escapeHtml(m.violation)}</span>`:''}${m.freeMeal?'<span class="pill blue">自由餐</span>':''}</div><div class="tiny muted" style="margin-top:7px">${escapeHtml(m.comment)}</div><div class="row wrap" style="margin-top:9px"><button class="reaction ${r==='稳'?'on':''}" onclick="react(${m.id},'稳')">💪 很稳</button><button class="reaction ${r==='赞'?'on':''}" onclick="react(${m.id},'赞')">👍 做得好</button><button class="reaction ${r==='抓'?'on':''}" onclick="react(${m.id},'抓')">👀 抓到了</button></div></div></div>`}
function react(id,val){const k=reactionKey(id,current);DB.reactions[k]=DB.reactions[k]===val?'':val;persist();renderFeed()}
function renderCheck(){const c=getCheck(current),ws=weekStats(current),p=USERS[current].partner;document.getElementById('pageCheck').innerHTML=`<div class="row between"><div><h1 style="margin:5px 0">每日打卡</h1><p class="muted">每天比“有没有完成”，不要比当天体重。</p></div><span class="pill">今日 ${dailyScore(current)}%</span></div><div class="grid"><section class="card"><h2>今天的习惯</h2><div class="check-grid">${checkButton('water','💧 喝水达标',c.water)}${checkButton('exercise','🏃 完成运动/步行',c.exercise)}${checkButton('noSnack','🍫 没有计划外零食',c.noSnack)}${checkButton('sleep','😴 睡眠准备达标',c.sleep)}</div><div class="split"><div class="field"><label>今日步数</label><input type="number" value="${escapeHtml(c.steps||'')}" placeholder="例如 8000" onchange="setCheckField('steps',this.value)"></div><div class="field"><label>运动分钟</label><input type="number" value="${escapeHtml(c.exerciseMin||'')}" placeholder="例如 40" onchange="setCheckField('exerciseMin',this.value)"></div></div><div class="field"><label>今天最高饥饿感 1–10</label><input type="number" min="1" max="10" value="${escapeHtml(c.hungerPeak||'')}" placeholder="例如 6" onchange="setCheckField('hungerPeak',this.value)"></div><div class="callout ${(+c.hungerPeak||0)>=8?'warn':''}">${(+c.hungerPeak||0)>=8?'今天饥饿感偏高：允许使用救援餐，不算失败。':'建议每天晚上30秒完成一次打卡。'}</div></section><aside><section class="card"><h2>本周执行</h2><div class="week-score"><div class="scorebox"><b>${ws.avgScore}%</b><span class="tiny muted">平均完成度</span></div><div class="scorebox"><b>${ws.avgH}</b><span class="tiny muted">平均饥饿感</span></div><div class="scorebox"><b>${ws.violations}</b><span class="tiny muted">违规记录</span></div></div></section><section class="card" style="margin-top:14px"><h2>${USERS[p].name}今天</h2><div class="stat-line"><span>完成度</span><b>${dailyScore(p)}%</b></div><div class="stat-line"><span>记录餐次</span><b>${mealsOf(p).length}</b></div><div class="stat-line"><span>今日热量</span><b>${kcal(p)} kcal</b></div></section></aside></div><section class="card" style="margin-top:14px"><h2>6+1规则</h2><p class="muted" style="line-height:1.75">周日～周五按减脂计划执行；周六允许 <b>1顿自由餐</b>，不是一整天放纵。计划外零食、夜宵或暴食可以标记违规；补偿方式只使用轻量活动或恢复正常饮食，不使用断食。</p></section>`}
function checkButton(field,label,on){return `<button class="check-btn ${on?'on':''}" onclick="toggleCheck('${field}')"><b>${on?'✓ ':''}${label}</b></button>`}
function toggleCheck(field){const k=checkKey(current),c=getCheck(current);c[field]=!c[field];DB.checks[k]=c;persist();renderCheck();renderHome()}
function setCheckField(field,val){const k=checkKey(current),c=getCheck(current);c[field]=val;DB.checks[k]=c;persist();renderHome()}
function renderProgress(){const arr=DB.weights[current]||[],last=latestWeight(current),change=weightChange(current),bars=arr.slice(-8),ws=weekStats(current);document.getElementById('pageProgress').innerHTML=`<div class="row between"><div><h1 style="margin:5px 0">进度</h1><p class="muted">体重看周趋势；行为看每日完成率。</p></div><button class="secondary" onclick="openWeight()">＋ 每周记录</button></div><div class="grid"><section class="card"><h2>体重趋势</h2>${bars.length?`<div class="chart">${bars.map(x=>{const vals=bars.map(y=>+y.weight),min=Math.min(...vals),max=Math.max(...vals),h=max===min?78:45+(max-x.weight)/(max-min)*70;return `<div class="bar me" style="height:${h}px"><span>${x.weight}</span></div>`}).join('')}</div>`:'<div class="empty">建议每周固定一天、起床后上完厕所再记录。</div>'}</section><aside><section class="card"><h2>当前阶段</h2><div class="stat-list"><div class="stat-line"><span>最新体重</span><b>${last?last.weight+' kg':'—'}</b></div><div class="stat-line"><span>累计变化</span><b>${change===null?'—':(change>0?'+':'')+change+' kg'}</b></div><div class="stat-line"><span>最新腰围</span><b>${last&&last.waist?last.waist+' cm':'—'}</b></div></div></section></aside></div><section class="card" style="margin-top:14px"><h2>本周自动总结</h2><div class="week-score"><div class="scorebox"><b>${ws.avgK}</b><span class="tiny muted">平均 kcal/记录日</span></div><div class="scorebox"><b>${ws.avgP}g</b><span class="tiny muted">平均蛋白</span></div><div class="scorebox"><b>${ws.avgScore}%</b><span class="tiny muted">平均完成度</span></div></div><div class="callout" style="margin-top:12px">${weeklyAdvice(ws)}</div></section><section class="card" style="margin-top:14px"><h2>每周身体记录</h2>${arr.length?arr.slice().reverse().map(x=>`<div class="stat-line"><div><b>${x.date}</b><div class="tiny muted">${escapeHtml(x.note||'')}</div></div><div><b>${x.weight} kg</b>${x.waist?`<div class="tiny muted">腰围 ${x.waist}cm</div>`:''}</div></div>`).join(''):'<div class="empty">暂无记录。</div>'}</section>`}
function weeklyAdvice(ws){if(!ws.days)return '本周还没有足够数据。先坚持记录3天以上，周总结才有意义。';if(ws.avgH!=='—'&&+ws.avgH>=7.5)return '本周饥饿感偏高。下一周先提高蛋白质和蔬菜体积，不建议继续压低饮食。';if(ws.violations>=3)return '本周计划外进食偏多。下周重点不是更饿，而是提前准备救援餐和固定晚间流程。';if(ws.avgScore>=85)return '本周执行很稳定。继续保持，不需要因为某一天体重波动改变计划。';return '本周还有提升空间。下周只抓一个重点：把每天晚上的打卡完成。'}
function renderProfile(){const u=USERS[current],p=USERS[u.partner];document.getElementById('pageProfile').innerHTML=`<h1 style="margin:5px 0">${u.name}</h1><p class="muted">计划、数据和同步设置</p><section class="card"><h2>你的计划</h2><div class="stat-list"><div class="stat-line"><span>每日热量参考</span><b>${u.targetKcal} kcal</b></div><div class="stat-line"><span>蛋白质目标</span><b>${u.targetProtein} g</b></div><div class="stat-line"><span>搭档</span><b>${p.name}</b></div><div class="stat-line"><span>称重节奏</span><b>每周1次</b></div></div></section><section class="card" style="margin-top:14px"><h2>AI识别状态</h2><div class="callout">当前是 <b>本地食物估算器</b>：结合文字、份量和常见食物数据库计算。照片视觉识别接口已经预留，接入视觉模型后即可实现“只上传照片→自动识别食物与份量”。</div></section><section class="card" style="margin-top:14px"><h2>双人同步</h2><div class="callout warn">当前 V2 数据保存在本浏览器，所以两个人使用不同手机时不会自动同步。正式上线建议接 Supabase / Firebase；界面和数据结构已经按双人账户设计。</div></section><section class="card" style="margin-top:14px"><h2>数据备份</h2><div class="row wrap"><button class="secondary" onclick="exportData()">导出 JSON</button><label class="secondary">导入备份<input type="file" accept="application/json" hidden onchange="importData(this)"></label><button class="secondary danger" onclick="if(confirm('确定清空所有演示数据？'))resetData()">清空数据</button></div></section><button class="secondary danger" style="margin-top:14px" onclick="logout()">退出登录</button>`}
function renderAll(){if(!current||!USERS[current])return;renderHome();renderFeed();renderCheck();renderProgress();renderProfile()}
function openMeal(){mealType='午餐';photoData='';pendingEstimate=null;document.getElementById('foodText').value='';document.getElementById('portion').value='1';document.getElementById('hunger').value='5';document.getElementById('freeMeal').value='no';document.getElementById('violation').value='';document.getElementById('photoBox').innerHTML='<div><div style="font-size:30px">📷</div><b>拍照或选择食物照片</b><div class="tiny muted">照片会压缩后保存</div></div><input id="photoInput" type="file" accept="image/*" capture="environment" hidden onchange="previewPhoto(this)">';document.getElementById('estimateBox').classList.add('hidden');document.getElementById('saveMealBtn').classList.add('hidden');renderSeg();document.getElementById('mealModal').classList.remove('hidden')}
function closeMeal(){document.getElementById('mealModal').classList.add('hidden')}
function renderSeg(){document.getElementById('mealSeg').innerHTML=['早餐','午餐','晚餐','加餐'].map(x=>`<button class="${mealType===x?'on':''}" onclick="mealType='${x}';renderSeg()">${x}</button>`).join('')}
function previewPhoto(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=e=>{const img=new Image();img.onload=()=>{const c=document.createElement('canvas'),max=760,scale=Math.min(1,max/Math.max(img.width,img.height));c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);photoData=c.toDataURL('image/jpeg',.72);document.getElementById('photoBox').innerHTML=`<img src="${photoData}"><input id="photoInput" type="file" accept="image/*" capture="environment" hidden onchange="previewPhoto(this)">`};img.src=e.target.result};r.readAsDataURL(f)}
const foodDB=[['鸡胸肉',165,31],['鸡胸',165,31],['鸡肉',190,27],['牛肉',220,26],['猪肉',260,24],['鱼',160,22],['三文鱼',210,20],['虾',100,24],['鸡蛋',75,6],['米饭',180,4],['饭',180,4],['拉面',500,18],['乌冬',320,9],['面',300,10],['面包',240,8],['香蕉',105,1],['苹果',80,0],['牛奶',180,10],['酸奶',110,10],['豆腐',100,10],['沙拉',90,3],['蔬菜',80,3],['西兰花',55,4],['火锅',650,35],['寿司',420,18],['炸鸡',500,25],['汉堡',480,22],['披萨',600,25],['奶茶',450,4],['蛋糕',380,5],['薯条',420,5],['坚果',180,5]];
function analyze(text,portion){let baseK=0,baseP=0,hits=0,t=text||'';for(const [key,k,p] of foodDB){if(t.includes(key)){baseK+=k;baseP+=p;hits++}}if(!hits){baseK=mealType==='早餐'?350:mealType==='加餐'?180:520;baseP=mealType==='加餐'?8:22}const gramMatches=[...t.matchAll(/(\d{2,3})\s*(g|克)/gi)];if(gramMatches.length&&hits){const avg=gramMatches.reduce((s,m)=>s+(+m[1]),0)/gramMatches.length;const factor=Math.min(1.8,Math.max(.55,avg/130));baseK*=factor;baseP*=factor}if(/半碗|半份|一小口|少量/.test(t)){baseK*=.72;baseP*=.82}if(/两个|2个/.test(t)&&/蛋/.test(t)){baseK+=75;baseP+=6}let kcal=Math.max(60,Math.round(baseK*portion)),protein=Math.max(0,Math.round(baseP*portion));let rating='很好',comment='这一顿份量和蛋白质比较稳。';if(kcal>800){rating='偏高';comment='这一顿热量偏高。下一顿恢复原计划即可，不需要断食补偿。'}else if(protein<15&&mealType!=='加餐'){rating='一般';comment='蛋白质偏少，下一餐优先鸡蛋、鸡胸、鱼、豆腐或无糖酸奶。'}else if(kcal<220&&mealType!=='加餐'){rating='一般';comment='这一顿偏少。如果很快明显饥饿，建议优先补一份优质蛋白。'}return{kcal,protein,rating,comment,source:hits?'文字+份量估算':'默认餐次估算'}}
function estimateMeal(){const food=document.getElementById('foodText').value.trim();if(!food&&!photoData){toast('至少上传照片或写一点食物说明');return}pendingEstimate=analyze(food,+document.getElementById('portion').value);const box=document.getElementById('estimateBox');box.classList.remove('hidden');box.innerHTML=`<div class="row between"><b>估算结果</b><span class="pill">${pendingEstimate.source}</span></div><div class="result-grid"><div class="field"><label>热量 kcal（可修正）</label><input id="estKcal" type="number" value="${pendingEstimate.kcal}"></div><div class="field"><label>蛋白质 g（可修正）</label><input id="estProtein" type="number" value="${pendingEstimate.protein}"></div></div><div class="callout"><b>${pendingEstimate.rating}</b> · ${pendingEstimate.comment}</div><div class="tiny muted" style="margin-top:8px">照片视觉AI尚未连接时，请用文字/克数辅助判断；正式接入后会自动识别照片。</div>`;document.getElementById('saveMealBtn').classList.remove('hidden')}
function saveMeal(){if(!pendingEstimate){estimateMeal();return}const food=document.getElementById('foodText').value.trim()||'仅照片记录',hunger=Math.max(1,Math.min(10,+document.getElementById('hunger').value||5)),freeMeal=document.getElementById('freeMeal').value==='yes',violation=document.getElementById('violation').value;const kcalVal=Math.max(0,+document.getElementById('estKcal').value||pendingEstimate.kcal),proteinVal=Math.max(0,+document.getElementById('estProtein').value||pendingEstimate.protein);let comment=pendingEstimate.comment,rating=pendingEstimate.rating;if(freeMeal&&!isSaturday())comment+='（注意：今天不是周六。）';if(freeMeal&&DB.meals.some(m=>m.user===current&&weekDates().includes(m.date)&&m.freeMeal))comment+='（本周已有自由餐记录。）';DB.meals.push({id:Date.now(),user:current,date:today(),ts:Date.now(),type:mealType,food,photo:photoData,kcal:Math.round(kcalVal),protein:Math.round(proteinVal),rating,comment,hunger,freeMeal,violation,portion:+document.getElementById('portion').value});persist();closeMeal();renderAll();toast(`已保存：约 ${Math.round(kcalVal)} kcal · 蛋白 ${Math.round(proteinVal)}g`)}
function openWeight(){document.getElementById('weightInput').value='';document.getElementById('waistInput').value='';document.getElementById('noteInput').value='';document.getElementById('weightModal').classList.remove('hidden')}
function closeWeight(){document.getElementById('weightModal').classList.add('hidden')}
function saveWeight(){const w=+document.getElementById('weightInput').value,waist=+document.getElementById('waistInput').value;if(!w||w<30||w>300){toast('请输入有效体重');return}(DB.weights[current]||(DB.weights[current]=[])).push({date:today(),weight:w,waist:waist||null,note:document.getElementById('noteInput').value.trim(),ts:Date.now()});persist();closeWeight();renderAll();toast('本周身体记录已保存')}
function exportData(){const blob=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='couple-cut-backup-'+today()+'.json';a.click();URL.revokeObjectURL(a.href);toast('备份已导出')}
function importData(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=e=>{try{const x=JSON.parse(e.target.result);if(!x.meals||!x.weights)throw new Error('bad');DB=Object.assign(structuredClone(seed),x);persist();renderAll();toast('备份已导入')}catch(err){toast('备份文件格式不正确')}};r.readAsText(f)}
function resetData(){DB=structuredClone(seed);persist();renderAll();toast('数据已清空')}
function toast(s){const e=document.getElementById('toast');e.textContent=s;e.classList.remove('hidden');clearTimeout(window.__toast);window.__toast=setTimeout(()=>e.classList.add('hidden'),2400)}
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
if(current&&USERS[current])enter();
</script>
